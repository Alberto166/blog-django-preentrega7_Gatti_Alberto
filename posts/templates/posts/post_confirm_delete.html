{% extends 'posts/base.html' %}

{% block contenido %}
<div style="max-width: 600px; margin: 50px auto; padding: 30px; border: 1px solid #dc3545; border-radius: 8px; background-color: #fff5f5; text-align: center;">
    <h2 style="color: #dc3545;">¿Estás seguro de que querés eliminar el post?</h2>
    <p style="font-size: 1.2em; margin: 20px 0;">Vas a borrar permanentemente la publicación: <strong>"{{ post.titulo }}"</strong></p>
    <p><small style="color: #6c757d;">Esta acción no se puede deshacer.</small></p>
    <hr style="border-top: 1px solid #dee2e6; margin: 20px 0;">
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Confirmar eliminación</button>
        <a href="{% url 'detalle_post' post.pk %}" style="padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px; margin-left: 10px; display: inline-block;">Cancelar</a>
    </form>
</div>
{% endblock %}
