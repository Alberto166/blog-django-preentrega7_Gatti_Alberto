{% extends 'posts/base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
    <h2>Iniciar Sesión</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Ingresar</button>
    </form>
    <p style="margin-top: 15px;">¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate acá</a></p>
</div>
{% endblock %}
